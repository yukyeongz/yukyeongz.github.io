<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>진안 학교 전거레코드 — SPARQL 조회 (테스트)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  .subtitle { color: #666; font-size: 0.9rem; margin-top: -0.5rem; }
  textarea { width: 100%; height: 8rem; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; box-sizing: border-box; padding: 0.5rem; }
  #examples { margin: 0.6rem 0; }
  .tpl-group { margin-bottom: 0.6rem; }
  .tpl-group h3 { font-size: 0.9rem; margin: 0.6rem 0 0.3rem; color: #444; }
  .tpl-item { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
  .tpl-item .tpl-label { font-size: 0.8rem; color: #555; flex: 1 1 260px; }
  .tpl-item input[type="text"] { width: 100%; padding: 0.3rem 0.4rem; font-size: 0.85rem; box-sizing: border-box; }
  .combo-wrap { position: relative; flex: 1 1 220px; }
  .combo-list { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 10; max-height: 220px;
    overflow-y: auto; background: #fff; border: 1px solid #ccc; border-top: none; font-size: 0.85rem; }
  .combo-item { padding: 0.3rem 0.5rem; cursor: pointer; }
  .combo-item:hover { background: #eef; }
  .tpl-item button { font-size: 0.8rem; padding: 0.3rem 0.6rem; cursor: pointer; white-space: nowrap; }
  #run-btn { margin-top: 0.5rem; padding: 0.5rem 1.2rem; font-weight: bold; cursor: pointer; }
  .status { margin: 0.6rem 0; font-size: 0.85rem; color: #555; }
  .status.error { color: #c00; }
  #triple-count { font-size: 0.8rem; color: #888; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-top: 0.5rem; }
  th, td { border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: left; word-break: break-all; }
  th { background: #f0f0f0; }
  .result-count { font-weight: bold; margin: 0.5rem 0 0.2rem; }
  @media (prefers-color-scheme: dark) {
    .subtitle { color: #aaa; }
    .status { color: #bbb; }
    #triple-count { color: #999; }
    th { background: #333; }
    th, td { border-color: #555; }
    .tpl-group h3 { color: #ccc; }
    .tpl-item .tpl-label { color: #aaa; }
    .combo-list { background: #222; border-color: #555; }
    .combo-item:hover { background: #345; }
  }
</style>
</head>
<body>
  <h1>진안 학교 전거레코드 — SPARQL 조회 (테스트)</h1>
  <p class="subtitle">브라우저 내에서 public.ttl을 직접 파싱해 SPARQL로 질의합니다(서버 없음, N3.js + Comunica).</p>
  <p id="triple-count"></p>

  <div id="examples"></div>
  <textarea id="query-box" spellcheck="false"></textarea>
  <br>
  <button id="run-btn">쿼리 실행</button>
  <p id="status" class="status">불러오는 중...</p>
  <div id="results"></div>

  <script src="./bundle.js"></script>
</body>
</html>
